<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142421" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Patchlands — Invite</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background: #f7f8f5;
        color: #161a18;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 30rem;
        padding: clamp(1.5rem, 6vw, 3rem);
        border-radius: 1.5rem;
        background: #142421;
        color: #fff;
        box-shadow: 0 1.5rem 3rem #1424211f;
      }
      .eyebrow { color: #cfe7d8; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.1; letter-spacing: -0.04em; }
      p { color: #d8e5de; }
      a { color: #cfe7d8; text-underline-offset: 0.2em; }
      .button {
        display: inline-block;
        padding: 0.8rem 1.3rem;
        border-radius: 0.6rem;
        background: #f2d275;
        color: #142421;
        font-weight: 700;
        text-decoration: none;
      }
      .button:hover { background: #ffe59a; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Patchlands · Invite</div>
      <h1>Play together.</h1>
      <p id="message">Opening your invite in Patchlands. If the link does not automatically redirect you, click below.</p>
      <a id="open-app" class="button" hidden>Open Patchlands</a>
      <noscript><p>Enable JavaScript and reload this page to open this invite in Patchlands.</p></noscript>
      <p>Need the app? <a href="/patchlands/download">Download Patchlands</a>, then return to this invite.</p>
    </main>
    <script>
      (() => {
        const openApp = document.getElementById("open-app");
        const message = document.getElementById("message");
        const tag = new URLSearchParams(window.location.search).get("tag");

        if (!tag || !tag.trim()) {
          message.textContent = "This invite is missing a player tag. Ask your friend to share their invite link again.";
          return;
        }

        // Keep the original query encoding, including %23 in player tags.
        const inviteUrl = "patchlands://invite" + window.location.search;
        openApp.href = inviteUrl;
        openApp.hidden = false;

        // A real anchor remains available if the browser blocks this attempt.
        // Do not retry on a timer: app launches cannot be reliably detected,
        // and repeated attempts may show duplicate permission prompts.
        try {
          window.location.replace(inviteUrl);
        } catch {
          message.textContent = "Click below to open your invite in Patchlands.";
        }
      })();
    </script>
  </body>
</html>
